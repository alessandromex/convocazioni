name: App Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Installa Capacitor
        run: npm install

      - name: Crea il progetto Android
        run: |
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#ffffff' --splashBackgroundColor '#7E1E2C'
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          npx cap sync android

      - name: Compila e firma l'APK
        run: >
          npx cap build android
          --keystorepath "$GITHUB_WORKSPACE/release.keystore"
          --keystorepass pontelungo1949
          --keystorealias convocazioni
          --keystorealiaspass pontelungo1949
          --androidreleasetype APK

      - name: Prepara il file
        run: |
          mkdir -p out
          cp "$(find android/app/build/outputs/apk/release -name '*.apk' | grep -i signed | head -1 || find android/app/build/outputs/apk/release -name '*.apk' | head -1)" out/convocazioni.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: convocazioni-apk
          path: out/convocazioni.apk

      - name: Pubblica nella pagina Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "v1.${{ github.run_number }}" out/convocazioni.apk
          --title "Convocazioni U17 - versione 1.${{ github.run_number }}"
          --notes "Scarica convocazioni.apk sul telefono Android e aprilo per installare o aggiornare l'app."
          --latest
